<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Aroma Ladies Spa — Home Spa Reel</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&family=Tajawal:wght@500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1816;--taupe:#3b3532;--ch:#ecd9bb;--rg:#c4917f;--iv:#f5ede1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e0c0b;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;
 background:radial-gradient(120% 80% at 50% 30%,#2d2724 0%,#1c1816 60%,#141110 100%);
 font-family:'Cairo','Tajawal','Geeza Pro','Segoe UI',Tahoma,sans-serif;color:var(--ch)}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(196,145,127,.22);will-change:transform}
#r1{width:1400px;height:1400px;left:-160px;top:560px}
#r2{width:900px;height:900px;left:700px;top:-200px;border-color:rgba(236,217,187,.14)}
#world{position:absolute;inset:0;transform-origin:540px 1260px;will-change:transform,opacity}
.panel{position:absolute;left:0;top:820px;width:880px;height:880px;border-radius:36px;overflow:hidden;
 background:linear-gradient(135deg,#4a403b,#2a2522 60%,#6b4f47);box-shadow:0 0 0 1.5px rgba(236,217,187,.35);will-change:transform}
.panel img{position:absolute;left:-7.5%;top:0;width:115%;height:100%;object-fit:cover;will-change:transform}
.panel.missing img{display:none}
.blk{position:absolute;left:90px;width:900px;text-align:center;direction:rtl;will-change:transform,opacity;transform-origin:30% 40%}
.ln{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em;direction:rtl;line-height:1.42;
 font-weight:600;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.big{font-size:96px;color:var(--ch)}
.sub{font-size:84px;color:var(--iv)}
.w{display:inline-block;opacity:0;will-change:transform,opacity}
.u{position:relative;display:inline-flex;column-gap:.3em;will-change:transform;transform-origin:50% 90%}
.u svg{position:absolute;left:-2%;width:104%;bottom:-.04em;height:.3em;overflow:visible}
.u path{fill:none;stroke:var(--c,var(--ch));stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
#s4>*{position:absolute;opacity:0}
#hl{left:160px;top:700px;width:760px;height:2px;background:linear-gradient(90deg,transparent,var(--ch),transparent);transform-origin:50% 50%}
#logoBox{left:0;top:240px;width:1080px;height:400px;display:flex;align-items:center;justify-content:center}
#logo{max-width:560px;max-height:400px;object-fit:contain}
#brand{left:0;top:745px;width:1080px;text-align:center;direction:ltr;font:600 92px 'Cormorant Garamond',Georgia,serif;letter-spacing:.05em;color:var(--ch)}
#tag{top:920px}
#book{left:0;top:1320px;width:1080px;text-align:center;font:500 54px 'Tajawal','Cairo',sans-serif;color:#c9a58f}
#num{left:0;top:1400px;width:1080px;text-align:center;direction:ltr;font:500 84px 'Tajawal','Cairo',sans-serif;letter-spacing:.08em;color:var(--ch)}
</style>
</head>
<body>
<div id="stage">
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div id="world"></div>
  <div id="txt"></div>
  <div id="s4">
    <div id="hl"></div>
    <div id="logoBox"><img id="logo" alt="Aroma Ladies Spa"></div>
    <div id="brand">Aroma Ladies Spa</div>
    <div class="blk" id="tag"></div>
    <div id="book">للحجز والاستفسار</div>
    <div id="num">0544450244</div>
  </div>
</div>
<script>
// ===== CONFIG: change filenames here =====
const CFG={
  images:['home1.png','home2.png','home3.png'],
  logo:'logo.png',
  fit:['cover','cover','cover'],            // use 'contain' to avoid any cropping
  pos:['50% 50%','50% 50%','50% 50%']       // focal point per image
};
const DUR=20;

// ===== helpers =====
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,d)=>clamp((t-a)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c=1.4,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ebs=x=>{const c=.7,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

// ===== build world =====
const world=$('world'),panels=[];
CFG.images.forEach((src,i)=>{
  const p=document.createElement('div');p.className='panel';
  const im=new Image();im.decoding='async';im.alt='';
  im.style.objectFit=CFG.fit[i];im.style.objectPosition=CFG.pos[i];
  im.onerror=()=>p.classList.add('missing');
  im.src=src;p.appendChild(im);world.appendChild(p);panels.push({p,im});
});
$('logo').onerror=function(){this.style.display='none'};
$('logo').src=CFG.logo;

// ===== text builder =====
const words=[],uls=[],pulses=[],NS='http://www.w3.org/2000/svg';
const txt=$('txt');
function blk(top,parent){const d=document.createElement('div');d.className='blk';d.style.top=top+'px';(parent||txt).appendChild(d);return d}
function line(parent,str,a,step,o={}){
  const d=document.createElement('div');d.className='ln '+(o.cls||'big');parent.appendChild(d);
  let t=a;
  str.split(/(\[[^\]]+\])/).filter(Boolean).forEach(part=>{
    let host=d,g=null;
    if(part[0]==='['){g=document.createElement('span');g.className='u';d.appendChild(g);host=g;part=part.slice(1,-1)}
    part.trim().split(/\s+/).forEach(w=>{
      const s=document.createElement('span');s.className='w';s.textContent=w;host.appendChild(s);
      words.push({el:s,a:t});t+=step;
    });
    if(g){
      const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 200 20');svg.setAttribute('preserveAspectRatio','none');
      const path=document.createElementNS(NS,'path');path.setAttribute('pathLength','1');
      path.setAttribute('d','M4 13 C 40 5, 80 18, 120 9 S 180 7, 196 12');
      path.style.setProperty('--c',o.ulc==='rg'?'var(--rg)':'var(--ch)');
      svg.appendChild(path);g.appendChild(svg);
      uls.push({p:path,a:o.ul,d:.55});pulses.push({el:g,a:o.ul-.1});
    }
  });
}
const A=blk(200),B=blk(500),C=blk(200),D=blk(500),E=blk(200),F=blk(500),T4=$('tag');
line(A,'ليش تطلعين [من بيتج…] 👀',-.08,.14,{cls:'big',ul:1.5});
line(B,'إذا الدلال يقدر [لين عندج؟] 🤍',2.9,.16,{cls:'sub',ul:3.4,ulc:'rg'});
line(C,'إنتِ في راحة بيتج…',4.3,.22,{cls:'big'});
line(D,'وإحنا نييج [لين عندج.] ✨',5.7,.2,{cls:'sub',ul:6.7});
line(E,'مساج، عناية، وراحة…',9.3,.24,{cls:'big'});
line(F,'كل هذا في [خصوصية بيتج.] 🤍',10.5,.18,{cls:'sub',ul:11.6,ulc:'rg'});
line(T4,'دلّعي عمرج… وإحنا نييج لين عندج. 🤍',15.9,.2,{cls:'sub'});
T4.style.opacity=1;T4.style.fontSize='78px';

// ===== render: pure function of time =====
const exits=[[B,3.95],[C,8.7],[D,8.7],[E,13.4],[F,13.4]];
const logo=$('logoBox'),hl=$('hl'),brand=$('brand'),book=$('book'),num=$('num');
const r1=$('r1'),r2=$('r2');
const kbStart=[2.2,4.6,9.4];

function render(t){
  // camera
  const cam=-1000+1000*ebs(seg(t,2.2,1.3))+1000*eio(seg(t,4.0,1.3))+1000*eio(seg(t,9.0,1.3));
  const ws=1+.12*(1-eo(seg(t,2.2,1.3)))-.2*eio(seg(t,13.8,.9));
  world.style.transform='scale('+ws+')';
  world.style.opacity=1-eio(seg(t,14.1,.7));
  panels.forEach((o,i)=>{
    o.p.style.transform='translate3d('+(100+i*1000-cam)+'px,0,0)';
    o.im.style.transform='translate3d('+((cam-i*1000)*.12)+'px,0,0) scale('+(1.12+.1*seg(t,kbStart[i],4.5))+')';
  });
  r1.style.transform='translate3d('+(-cam*.08)+'px,0,0)';
  r2.style.transform='translate3d('+(-cam*.14)+'px,0,0)';

  // words, underlines, pulses
  for(const w of words){
    const p=seg(t,w.a,.42);
    w.el.style.opacity=clamp(p*4);
    w.el.style.transform='translate3d('+((1-eb(p))*130)+'px,0,0)';
  }
  for(const u of uls)u.p.style.strokeDashoffset=1-eio(seg(t,u.a,u.d));
  for(const p of pulses)p.el.style.transform='scale('+(1+.1*Math.sin(Math.PI*seg(t,p.a,.55)))+')';

  // block A: hook line with camera push, then moves aside
  const zoom=1+.22*(eio(seg(t,.9,.7))-eio(seg(t,1.9,.6)));
  const q=eio(seg(t,2.4,.7)),ex=eio(seg(t,3.95,.4));
  A.style.transform='translate3d('+(-140*ex)+'px,'+(330*(1-q))+'px,0) scale('+((1.12-.34*q)*zoom)+')';
  A.style.opacity=(1-.4*q)*(1-ex);
  // other blocks: exit left
  for(const [el,a] of exits){
    const e=eio(seg(t,a,.45));
    el.style.transform='translate3d('+(-140*e)+'px,0,0)';el.style.opacity=1-e;
  }

  // scene four
  let p=seg(t,14.9,.8);
  logo.style.opacity=clamp(p*2);logo.style.transform='scale('+(.88+.12*eb(p))+')';
  hl.style.opacity=t>14.5?1:0;hl.style.transform='scaleX('+eio(seg(t,14.5,.7))+')';
  p=eo(seg(t,15.5,.6));brand.style.opacity=p;brand.style.transform='translate3d(0,'+(30*(1-p))+'px,0)';
  p=eo(seg(t,17.3,.5));book.style.opacity=p;book.style.transform='translate3d(0,'+(24*(1-p))+'px,0)';
  p=seg(t,17.7,.6);num.style.opacity=clamp(p*2);num.style.transform='scale('+(.94+.06*eo(p))+')';
}

// ===== stage fit =====
function fit(){
  const s=Math.min(innerWidth/1080,innerHeight/1920);
  $('stage').style.transform='scale('+s+') translate(-540px,-960px)';
}
// translate after scale with origin 0 0: left/top 50% handled via translate(-540px,-960px) in pre-scale units
addEventListener('resize',fit);fit();

// ===== playback =====
let t0=null,raf=0;
function frame(now){
  if(t0===null)t0=now;
  const t=Math.min((now-t0)/1000,DUR);
  render(t);
  if(t<DUR)raf=requestAnimationFrame(frame);
}
function play(){cancelAnimationFrame(raf);t0=null;render(0);raf=requestAnimationFrame(frame)}
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(1);i.onerror=()=>r(0);i.src=src});
const ready=Promise.all([...CFG.images.map(load),load(CFG.logo),document.fonts?document.fonts.ready:0]);
const preview=new URLSearchParams(location.search).get('t');
render(0);
Promise.race([ready,new Promise(r=>setTimeout(r,3000))]).then(()=>{
  if(preview!==null){render(parseFloat(preview))}else{play()}
});
addEventListener('click',()=>{if(preview===null)play()});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'||e.key===' ')play()});
</script>
</body>
</html>
